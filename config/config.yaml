# =============================================================================
# Configuración principal del Trading Bot (Alpaca)
# =============================================================================

broker:
  name: alpaca
  paper: true                # true = paper trading, false = cuenta real
  api_key: ""                # Definir en alpaca_env.sh o variables de entorno
  secret_key: ""
  base_url: "https://paper-api.alpaca.markets"   # paper; real: https://api.alpaca.markets

universo:
  # Objetivo: llevar $100 a $200 en corto plazo.
  # Prioriza tickers con opciones líquidas y primas accesibles:
  # ETFs apalancados (TQQQ/SQQQ) para el reto de doblar capital rápido,
  # tickers de precio bajo con opciones líquidas (primas ~$1-10 accesibles
  # para $100 de capital). Ver universo_reto más abajo.
  tickers:
    - SPY
    - QQQ
    - IWM
    - TQQQ
    - SQQQ
    - NVDA
    - TSLA
    - AMD
    - PLTR
    - SOFI
    - AAPL
    - AMZN
    - META
    - MSFT
    - GOOGL
  max_tickers: 20
  min_price: 5.0             # Evitar penny stocks
  min_avg_volume: 500_000    # Liquidez mínima diaria (más laxa para el reto)
  # ===================================================================
  # PERFIL RETO $100 -> $200 (sobreescribe universo cuando active: true)
  # Ajuste tras backtest (jul-ago 2026): la calibración con megacaps no
  # generaba trades; los DTE muy cortos en tickers baratos eran devorados
  # por theta. Este perfil usa tickers baratos + spreads debit 10-45 DTE.
  # ===================================================================
  universo_reto:
    active: true             # false → usa 'tickers' clásico
    tickers:
      - SOFI
      - PLTR
      - F
      - TSLA
      - AMD
      - NOK
      - BB
      - TQQQ
    # Se excluyen LCID y MARA: volatilidad anualizada extrema (~150%) hace que
    # las primas sean impagables y los spreads simulados degeneren (backtest).
    min_price: 3.0
    min_avg_volume: 1_000_000  # más exigente: liquidez de opciones clave
    max_vol_pct: 100.0         # excluir tickers con vol. histórica > 100%
  # ===================================================================
  # MOTOR BAJISTA (put spreads sobre CHoCH bear) — ronda 5, 17 ago 2026
  # Hasta ahora el bot era long-only y en regimen bear no hacia NADA.
  # put_choch es lo unico del corpus con ventaja positiva, consistente y
  # fuera de muestra: 75% de ventanas bajistas en positivo, mediana +6.8%,
  # batiendo al cash (-1.3%).
  # Dos condiciones vienen de la medicion y NO son opcionales:
  #   - min_premium_net 100: por debajo, las 4 comisiones del spread ($2.60)
  #     se comen la ventaja (a prima $15 son el 17% del capital arriesgado y
  #     el resultado cae a -5.2%).
  #   - tp 1.5 / sl 0.50: con el 1.4/0.25 de los calls NUNCA cruza el umbral.
  # NO usar el motor `regime_aware` del backtest: es PEOR que quedarse en
  # cash (12.5% de ventanas positivas frente al 37.5% del cash).
  # ===================================================================
  options_bear:
    enabled: true
    delta_long: 0.30
    delta_short: 0.10
    dte_min: 14
    dte_max: 35
    min_premium_net: 100.0     # umbral medido en la ronda 5
    tp_premium_mult: 1.5
    sl_premium_mult: 0.50
    close_dte: 7
    max_positions: 2
  # Parámetros de estructuras para el reto (usados por options_bridge):
  options_reto:
    direction: bull            # solo largos en fase 1 (sin pata corta expuesta)
    delta_long: 0.25           # long call: ~25 delta, prima asequible
    delta_short: 0.10          # short call OTM: reduce coste neto y theta
    max_premium_net: 12.0      # prima neta máx $12 por spread (~12% capital)
    dte_min: 10                # mínimo 10 días: no comprar theta extremo
    dte_max: 45                # máximo 45 días: no pagar vega de más
    tp_premium_mult: 1.4       # take profit: +40% de prima
    sl_premium_mult: 0.25      # stop loss: -75% de prima
    close_dte: 7               # cerrar si quedan 7 días al vencimiento (evita gamma de última semana)

data:
  provider: alpaca           # alpaca (real) o yfinance (respaldo sin API key)
  bars:
    - 1min
    - 5min
    - 15min
    - 1d
  history_days: 365          # Días de historia para backtest
  refresh_interval_min: 5    # Frecuencia de actualización en vivo
  db: sqlite:///data/market.db

# Capa de setups del PDF: evalúa todos los patrones en shadow y guarda
# observaciones, pero no modifica entradas hasta una promoción A/B explícita.
setups:
  enabled: true
  mode: shadow              # shadow | paper_filter (nunca habilita REAL)
  influence_entries: false  # solo true tras walk-forward y revisión humana
  min_structural_score: 0.55
  min_confirmations: 2
  max_signal_age_bars: 3
  timeframes:
    regime: 1d
    setup: 15min
    entry: 5min

# Candidatos de spreads de riesgo definido. Solo observabilidad shadow:
# no importa el executor, no crea órdenes y no puede cambiar entradas/riesgo.
defined_risk_shadow:
  enabled: true
  mode: shadow
  influence_entries: false
  orders_allowed: false
  max_symbols: 8
  max_spread_bps: 800.0

# Filtro VIX de la segunda validación walk-forward. Solo registra qué habría
# bloqueado una entrada; nunca bloquea ni modifica el flujo operativo.
vix_shadow:
  enabled: true
  mode: shadow
  influence_entries: false
  orders_allowed: false
  source_symbol: "^VIX"
  history_days: 400
  variants:
    - shock_10
    - percentile_70
    - level_25

# Estructura de mercado multi-timeframe: solo observabilidad. Evalúa
# máximos/mínimos confirmados en barras cerradas de 1d/15min/5min.
structure_mtf_shadow:
  enabled: true
  mode: shadow
  influence_entries: false
  orders_allowed: false
  timeframes:
    - 1d
    - 15min
    - 5min
  weights:
    1d: 0.50
    15min: 0.30
    5min: 0.20
  pivot_order: 3
  tolerance: 0.001

# Motor auxiliar de breakdown/retest bajista intradía. Se registra en shadow
# para medir señales en PAPER; no filtra entradas ni puede enviar órdenes.
bearish_breakdown_shadow:
  enabled: true
  mode: shadow
  influence_entries: false
  orders_allowed: false
  timeframe: 15min
  support_mode: rolling_support
  lookback: 20
  atr_period: 14
  break_atr: 0.10
  volume_min: 1.20
  retest_max_bars: 3
  retest_tolerance_atr: 0.25
  stop_buffer_atr: 0.10
  reward_risk: 2.0

# Continuación tras retroceso hacia EMA/VWAP. Solo observabilidad shadow;
# no filtra entradas ni puede crear órdenes.
trend_pullback_shadow:
  enabled: true
  mode: shadow
  influence_entries: false
  orders_allowed: false
  timeframe: 15min
  direction: long
  ema_fast: 9
  ema_slow: 21
  atr_period: 14
  trend_slope_bars: 3
  impulse_lookback: 5
  pullback_lookback: 3
  impulse_atr: 0.75
  vwap_tolerance_atr: 0.50
  break_buffer_atr: 0.05
  stop_buffer_atr: 0.10
  reward_risk: 2.0
  volume_lookback: 20
  volume_min: 1.20
  require_volume: true
  require_vwap_alignment: true
  allow_shorts: false
  session_start: "09:30"
  session_end: "15:30"

# Breakout Donchian de 55 barras con confirmación de volumen. Es una
# sensibilidad distinta al canal 10 del DayBreakout, pero permanece shadow.
breakout_20_55_shadow:
  enabled: true
  mode: shadow
  influence_entries: false
  orders_allowed: false
  timeframe: 15min
  lookback: 55
  volume_lookback: 20
  volume_min: 1.0
  atr_period: 14
  break_buffer_atr: 0.0
  stop_buffer_atr: 0.10
  reward_risk: 1.5
  hold_max_bars: 20
  session_start: "09:30"
  session_end: "15:30"
  one_signal_per_session: true
  allow_shorts: false
  gate: bull

# Promoción controlada en PAPER. Estas capas reutilizan OptionsStrategy,
# RiskManager, floor y circuit breakers. No habilita defined-risk: el executor
# actual envía patas secuenciales y no ofrece atomicidad multi-leg.
promoted_layers:
  enabled: true
  trend_pullback: true
  breakout_20_55: true
  breakdown_retest: true
  use_vix_gate: true       # VIX sigue siendo contexto; no genera entradas
  use_structure_gate: true # estructura sigue siendo contexto; no genera entradas

strategies:
  # ---------------------------------------------------------------------------
  # DAY TRADING: momentum intradía con filtro de volatilidad (velas 5 min)
  # ---------------------------------------------------------------------------
  day_momentum:
    enabled: true
    type: day_trading
    timeframe: 5min
    params:
      fast_ema: 9
      slow_ema: 21
      atr_period: 14
      atr_multiplier_stop: 2.0
      volume_min_multiple: 1.5   # volumen vs promedio 20 períodos
      rsi_period: 14
      rsi_max: 70                # no comprar sobrecomprado
      rsi_min: 30                # no vender sobrevendido
      hold_max_bars: 48          # máximo ~4 horas de posición
      cooldown_minutes: 30       # tras salida, esperar antes de re-entrar

  # ---------------------------------------------------------------------------
  # DAY TRADING: breakout de apertura con canal Donchian (velas 15 min)
  # ---------------------------------------------------------------------------
  day_breakout:
    enabled: true
    type: day_trading
    timeframe: 15min
    params:
      donchian_period: 10        # canal de últimas 10 velas (2.5 h)
      atr_period: 14
      atr_multiplier_stop: 2.5
      breakout_conf_bars: 1      # velas de confirmación
      hold_max_bars: 20          # máximo ~5 horas
      session_start: "10:00"     # no operar la primera hora volátil
      session_end: "15:30"

  # ---------------------------------------------------------------------------
  # SWING TRADING: tendencia con cruce de medias + filtro de régimen (diario)
  # ---------------------------------------------------------------------------
  swing_trend:
    enabled: true
    type: swing
    timeframe: 1d
    params:
      fast_sma: 20
      slow_sma: 50
      trend_filter_sma: 200      # solo largas si precio > SMA200
      atr_period: 14
      atr_multiplier_stop: 3.0
      atr_multiplier_target: 6.0 # take profit dinámico
      min_hold_days: 2
      max_hold_days: 20

risk:
  # ---------------------------------------------------------------------------
  # PISO DE EQUITY EN DOS FASES (ver risk/floor.py)
  #   Fase 1 "recuperacion": equity < challenge_target -> rige recovery_floor.
  #   Fase 2 "reto":         equity >= challenge_target -> rige equity_floor.
  # Si equity vuelve a caer bajo el objetivo, recovery_override_below_target
  # permite recuperar con $99,000 sin eliminar el latch de trazabilidad.
  # ---------------------------------------------------------------------------
  floor:
    equity_floor: 99900.0        # piso del reto cuando equity >= $100,000
    challenge_target: 100000.0   # al alcanzarlo se arma el reto
    recovery_floor: 99000.0      # piso activo mientras se recupera
    recovery_override_below_target: true  # evita bloqueo circular bajo $100,000
  # Anti-earnings: bloquear entradas N días antes de reportes de ganancias
  earnings_horizon_days: 2
  # RETO $100 -> $200: perfil agresivo pero con válvulas de seguridad
  mode: aggressive             # conservative | moderate | aggressive
  max_risk_per_trade_pct: 5.0 # % del capital en riesgo por operación (~$20/trade)
  max_open_positions: 2        # pocas posiciones simultáneas por capital reducido
  max_sector_weight_pct: 60.0  # concentración permitida para el reto
  max_drawdown_daily_pct: 15.0 # detiene trading del día si pierde 15% ($15)
  max_drawdown_total_pct: 30.0 # detiene el bot si el capital cae a $70
  # Breaker diario en DOLARES ABSOLUTOS. Los porcentuales de arriba se miden
  # sobre la cuenta completa (15% de $99,689 = $14,953), asi que a la escala
  # del reto $100 no saltan nunca: harian falta ~19 perdidas totales de $777.
  # Este es el que de verdad corta una mala racha con el tamano de
  # recuperacion sin tope. Con $400, una unica entrada perdedora grande
  # (~$777) detiene las entradas del resto del dia en vez de encadenar otra.
  max_daily_loss_usd: 400.0
  # Gestión de prima por posición (reto): stop si la prima cae al 25% de la
  # entrada y take profit al +40%. Evita el error del backtest B donde una
  # posición de LCID perdió 93% por no tener stop de prima activo.
  prem_sl_mult: 0.25
  prem_tp_mult: 1.4
  allow_pyramiding: false
  allow_averaging_down: false
  # Horario de operación (hora Nueva York)
  market_open: "09:30"
  market_close: "16:00"

execution:
  order_type: limit              # limit | market
  limit_offset_pct: 0.1          # limite al precio +/- 0.1% para day trading
  default_time_in_force: day     # day | gtc
  slippage_bps: 5                # estimado para backtests
  commission_usd: 0.0            # Alpaca: sin comisiones en acciones
  min_order_usd: 100

monitor:
  log_level: INFO
  alerts:
    telegram_enabled: true
    telegram_token: ""
    telegram_chat_id: ""
    email_enabled: false
