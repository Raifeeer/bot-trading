# =============================================================================
# Configuración principal del Trading Bot (Alpaca)
# =============================================================================

broker:
  name: alpaca
  paper: true                # true = paper trading, false = cuenta real
  api_key: ""                # Definir en alpaca_env.sh o variables de entorno
  secret_key: ""
  base_url: "https://paper-api.alpaca.markets"   # paper; real: https://api.alpaca.markets

universo:
  # Objetivo: llevar $100 a $200 en corto plazo.
  # Prioriza tickers con opciones líquidas y primas accesibles:
  # ETFs apalancados (TQQQ/SQQQ) para el reto de doblar capital rápido,
  # tickers de precio bajo con opciones líquidas (primas ~$1-10 accesibles
  # para $100 de capital). Ver universo_reto más abajo.
  tickers:
    - SPY
    - QQQ
    - IWM
    - TQQQ
    - SQQQ
    - NVDA
    - TSLA
    - AMD
    - PLTR
    - SOFI
    - AAPL
    - AMZN
    - META
    - MSFT
    - GOOGL
  max_tickers: 20
  min_price: 5.0             # Evitar penny stocks
  min_avg_volume: 500_000    # Liquidez mínima diaria (más laxa para el reto)
  # ===================================================================
  # PERFIL RETO $100 -> $200 (sobreescribe universo cuando active: true)
  # Ajuste tras backtest (jul-ago 2026): la calibración con megacaps no
  # generaba trades; los DTE muy cortos en tickers baratos eran devorados
  # por theta. Este perfil usa tickers baratos + spreads debit 10-45 DTE.
  # ===================================================================
  universo_reto:
    active: true             # false → usa 'tickers' clásico
    tickers:
      - SOFI
      - PLTR
      - F
      - TSLA
      - AMD
      - NOK
      - BB
      - TQQQ
    # Se excluyen LCID y MARA: volatilidad anualizada extrema (~150%) hace que
    # las primas sean impagables y los spreads simulados degeneren (backtest).
    min_price: 3.0
    min_avg_volume: 1_000_000  # más exigente: liquidez de opciones clave
    max_vol_pct: 100.0         # excluir tickers con vol. histórica > 100%
  # Parámetros de estructuras para el reto (usados por options_bridge):
  options_reto:
    direction: bull            # solo largos en fase 1 (sin pata corta expuesta)
    delta_long: 0.25           # long call: ~25 delta, prima asequible
    delta_short: 0.10          # short call OTM: reduce coste neto y theta
    max_premium_net: 12.0      # prima neta máx $12 por spread (~12% capital)
    dte_min: 10                # mínimo 10 días: no comprar theta extremo
    dte_max: 45                # máximo 45 días: no pagar vega de más
    tp_premium_mult: 1.4       # take profit: +40% de prima
    sl_premium_mult: 0.25      # stop loss: -75% de prima
    close_dte: 7               # cerrar si quedan 7 días al vencimiento (evita gamma de última semana)

data:
  provider: alpaca           # alpaca (real) o yfinance (respaldo sin API key)
  bars:
    - 1min
    - 5min
    - 15min
    - 1d
  history_days: 365          # Días de historia para backtest
  refresh_interval_min: 5    # Frecuencia de actualización en vivo
  db: sqlite:///data/market.db

strategies:
  # ---------------------------------------------------------------------------
  # DAY TRADING: momentum intradía con filtro de volatilidad (velas 5 min)
  # ---------------------------------------------------------------------------
  day_momentum:
    enabled: true
    type: day_trading
    timeframe: 5min
    params:
      fast_ema: 9
      slow_ema: 21
      atr_period: 14
      atr_multiplier_stop: 2.0
      volume_min_multiple: 1.5   # volumen vs promedio 20 períodos
      rsi_period: 14
      rsi_max: 70                # no comprar sobrecomprado
      rsi_min: 30                # no vender sobrevendido
      hold_max_bars: 48          # máximo ~4 horas de posición
      cooldown_minutes: 30       # tras salida, esperar antes de re-entrar

  # ---------------------------------------------------------------------------
  # DAY TRADING: breakout de apertura con canal Donchian (velas 15 min)
  # ---------------------------------------------------------------------------
  day_breakout:
    enabled: true
    type: day_trading
    timeframe: 15min
    params:
      donchian_period: 10        # canal de últimas 10 velas (2.5 h)
      atr_period: 14
      atr_multiplier_stop: 2.5
      breakout_conf_bars: 1      # velas de confirmación
      hold_max_bars: 20          # máximo ~5 horas
      session_start: "10:00"     # no operar la primera hora volátil
      session_end: "15:30"

  # ---------------------------------------------------------------------------
  # SWING TRADING: tendencia con cruce de medias + filtro de régimen (diario)
  # ---------------------------------------------------------------------------
  swing_trend:
    enabled: true
    type: swing
    timeframe: 1d
    params:
      fast_sma: 20
      slow_sma: 50
      trend_filter_sma: 200      # solo largas si precio > SMA200
      atr_period: 14
      atr_multiplier_stop: 3.0
      atr_multiplier_target: 6.0 # take profit dinámico
      min_hold_days: 2
      max_hold_days: 20

risk:
  # RETO $100 -> $200: perfil agresivo pero con válvulas de seguridad
  mode: aggressive             # conservative | moderate | aggressive
  max_risk_per_trade_pct: 20.0 # % del capital en riesgo por operación (~$20/trade)
  max_open_positions: 2        # pocas posiciones simultáneas por capital reducido
  max_sector_weight_pct: 60.0  # concentración permitida para el reto
  max_drawdown_daily_pct: 15.0 # detiene trading del día si pierde 15% ($15)
  max_drawdown_total_pct: 30.0 # detiene el bot si el capital cae a $70
  # Gestión de prima por posición (reto): stop si la prima cae al 25% de la
  # entrada y take profit al +40%. Evita el error del backtest B donde una
  # posición de LCID perdió 93% por no tener stop de prima activo.
  prem_sl_mult: 0.25
  prem_tp_mult: 1.4
  allow_pyramiding: false
  allow_averaging_down: false
  # Horario de operación (hora Nueva York)
  market_open: "09:30"
  market_close: "16:00"

execution:
  order_type: limit              # limit | market
  limit_offset_pct: 0.1          # limite al precio +/- 0.1% para day trading
  default_time_in_force: day     # day | gtc
  slippage_bps: 5                # estimado para backtests
  commission_usd: 0.0            # Alpaca: sin comisiones en acciones
  min_order_usd: 100

monitor:
  log_level: INFO
  alerts:
    telegram_enabled: true
    telegram_token: ""
    telegram_chat_id: ""
    email_enabled: false
